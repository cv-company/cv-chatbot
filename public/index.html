<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CV company AIチャットボット</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* ランチャーボタン */
    .launcher-area {
      position: fixed;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      z-index: 9999;
    }

    .speech-bubble {
      background: #111e35;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.6;
      padding: 10px 16px;
      border-radius: 16px 16px 4px 16px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      position: relative;
      animation: fadeIn 0.5s ease;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px; right: 16px;
      width: 0; height: 0;
      border-left: 8px solid transparent;
      border-top: 8px solid #111e35;
    }
    .speech-bubble .highlight { color: #e8294a; font-weight: 700; }

    .launcher-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #111e35;
      border: 3px solid #e8294a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(17,30,53,0.4);
      transition: all 0.2s;
    }
    .launcher-btn:hover { transform: scale(1.08); }

    /* チャットウィンドウ */
    .chat-window {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 380px;
      height: 600px;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      z-index: 9998;
      transition: all 0.3s ease;
      transform-origin: bottom right;
    }
    .chat-window.hidden {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    /* スマホ対応 */
    @media (max-width: 480px) {
      .chat-window {
        position: fixed;
        bottom: 0; right: 0; left: 0;
        width: 100%;
        height: 90vh;
        border-radius: 20px 20px 0 0;
      }
      .launcher-area {
        bottom: 16px;
        right: 16px;
      }
      .speech-bubble {
        font-size: 12px;
        padding: 8px 12px;
      }
      .launcher-btn {
        width: 56px; height: 56px;
      }
    }

    /* ヘッダー */
    .chat-header {
      background: #111e35;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 2px solid #3a5298;
      flex-shrink: 0;
    }
    .chat-logo {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .chat-logo svg { width: 18px; height: 18px; }
    .chat-header-text { flex: 1; }
    .chat-header-text h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px; font-weight: 600;
      color: #fff; letter-spacing: 0.04em;
    }
    .chat-header-text p { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 2px; }
    .status-dot { width: 7px; height: 7px; background: #4fc88a; border-radius: 50%; animation: pulse 2s infinite; flex-shrink: 0; }
    .close-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.6); padding: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s;
    }
    .close-btn:hover { color: #fff; }

    /* メッセージエリア */
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
      background: #f5f7fa;
    }
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
    .message { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot { align-self: flex-start; }
    .message-avatar { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; }
    .bot .message-avatar { background: #111e35; color: #fff; }
    .user .message-avatar { background: #fff; border: 1px solid #ddd; color: #666; }
    .message-bubble { padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.6; }
    .bot .message-bubble { background: #fff; border: 1px solid #e0e0e0; color: #222; border-bottom-left-radius: 3px; }
    .user .message-bubble { background: #1a2a4a; color: #fff; border-bottom-right-radius: 3px; }
    .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 2px; }
    .typing-indicator span { width: 5px; height: 5px; background: #3a5298; border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    .timestamp { font-size: 10px; color: #999; text-align: center; }
    .msg-fade-in { animation: fadeUp 0.25s ease; }

    /* クイックチップス */
    .quick-chips {
      background: #111e35;
      padding: 8px 12px;
      display: flex; flex-wrap: wrap; gap: 5px;
      flex-shrink: 0;
    }
    .chip {
      font-size: 11px; padding: 5px 10px;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.6);
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 500; white-space: nowrap;
      transition: all 0.15s;
    }
    .chip:hover { background: rgba(255,255,255,0.28); }

    /* 入力エリア */
    .chat-input-area { padding: 8px 12px 10px; background: #111e35; flex-shrink: 0; }
    .input-wrapper { display: flex; align-items: center; gap: 6px; }
    .input-box {
      flex: 1; background: #fff;
      border: 1.5px solid rgba(255,255,255,0.6);
      border-radius: 20px; padding: 7px 12px;
    }
    .chat-input {
      width: 100%; border: none; background: transparent;
      font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
      color: #1a2a4a; outline: none; resize: none;
      height: 20px; line-height: 20px;
    }
    .chat-input::placeholder { color: #999; }
    .voice-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; background: #2a3f6f;
      border: 2px solid #fff; border-radius: 10px;
      padding: 4px 8px; cursor: pointer;
      flex-shrink: 0; min-width: 52px; height: 36px;
      transition: all 0.15s;
    }
    .voice-btn:hover { background: #3a5298; }
    .voice-btn .btn-label { font-size: 8px; color: #fff; font-weight: 500; line-height: 1; white-space: nowrap; }
    .voice-btn.listening { background: #8b1a1a; border-color: #ff9999; animation: voicePulse 1s infinite; }
    .send-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; background: #3a5298;
      border: 2px solid #fff; border-radius: 10px;
      padding: 4px 8px; cursor: pointer;
      flex-shrink: 0; min-width: 40px; height: 36px;
      transition: all 0.15s;
    }
    .send-btn:hover { background: #4a63b8; }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
    .send-btn .btn-label { font-size: 8px; color: #fff; font-weight: 500; line-height: 1; white-space: nowrap; }
    .voice-status { font-size: 10px; color: rgba(255,255,255,0.6); text-align: center; padding: 4px 0 0; min-height: 14px; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes voicePulse { 0%,100%{box-shadow:0 0 0 0 rgba(226,75,74,0.4)} 50%{box-shadow:0 0 0 6px rgba(226,75,74,0)} }
  </style>
</head>
<body>

<!-- チャットウィンドウ -->
<div class="chat-window hidden" id="chatWindow">
  <div class="chat-header">
    <div class="chat-logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 3C7.03 3 3 7.03 3 12C3 14.39 3.93 16.55 5.47 18.16L3.5 20.5H12C16.97 20.5 21 16.47 21 11.5C21 7.03 16.97 3 12 3Z" fill="rgba(255,255,255,0.85)"/>
        <circle cx="8.5" cy="12" r="1.1" fill="#3a5298"/>
        <circle cx="12" cy="12" r="1.1" fill="#3a5298"/>
        <circle cx="15.5" cy="12" r="1.1" fill="#3a5298"/>
      </svg>
    </div>
    <div class="chat-header-text">
      <h3>CV company AI アシスタント</h3>
      <p>持続可能な未来をデザインするパートナー</p>
    </div>
    <div class="status-dot"></div>
    <button class="close-btn" onclick="toggleChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="timestamp">本日 — チャット開始</div>
    <div class="message bot msg-fade-in">
      <div class="message-avatar">CV</div>
      <div class="message-bubble">
        こんにちは！株式会社CV companyのAIアシスタントです。<br><br>
       各種お問い合わせ・お見積り・太陽光設備・ドローン事業・各種デザイン・各種印刷・動画制作など、お気軽にご質問ください。テキストでも音声でも承ります。
      </div>
    </div>
  </div>

  <div class="quick-chips" id="quickChips">
    <button class="chip" onclick="sendChip('各種お問い合わせをしたい')">各種お問合せ</button>
    <button class="chip" onclick="sendChip('お見積りを依頼したい')">お見積り依頼</button>
    <button class="chip" onclick="sendChip('太陽光設備について教えてください')">太陽光設備について</button>
    <button class="chip" onclick="sendChip('公式LINEを教えてください')">公式LINE</button>
    <button class="chip" onclick="sendChip('会社概要を教えてください')">会社概要</button>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <div class="input-box">
        <textarea class="chat-input" id="chatInput" placeholder="メッセージを入力..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
          <rect x="9" y="2" width="6" height="13" rx="3"/>
          <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span class="btn-label">音声入力</span>
      </button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
        <span class="btn-label">送信</span>
      </button>
    </div>
    <div class="voice-status" id="voiceStatus"></div>
  </div>
</div>

<!-- ランチャーボタン -->
<div class="launcher-area" id="launcherArea">
  <div class="speech-bubble" id="speechBubble">
    <span class="highlight">CV company</span> AIアシスタント<br>
    お気軽にご相談ください！
  </div>
  <button class="launcher-btn" onclick="toggleChat()">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>
</div>

<script>
const SYSTEM_PROMPT = `あなたは株式会社CV companyのAIアシスタントです。CV companyは「持続可能な未来をデザインするパートナー」をミッションに掲げ、太陽光発電設備の販売・施工、サステナビリティコンサルティング、環境ソリューションを提供する会社です。

以下のガイドラインで回答してください：
- 丁寧で親しみやすい日本語で話す
- 太陽光設備・お見積り・お問い合わせ・会社情報の質問に専門的に回答する
- ドローン事業として、ドローンによる動画撮影（PRビデオ制作）と太陽光パネルのドローン点検サービスを提供している
- 各種デザイン制作、各種印刷、動画制作サービスも提供している
- お見積りや詳細なお問い合わせは「担当者よりご連絡いたします」と案内する
- 公式LINEについては「公式LINEよりお気軽にご連絡ください」と案内する
- 回答は200字以内を目安に簡潔にまとめる
- 絵文字は使わない`;

let isTyping = false, recognition = null, isListening = false, conversationHistory = [];
let chatOpen = false;

const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const chatMessages = document.getElementById('chatMessages');
const voiceBtn = document.getElementById('voiceBtn');
const voiceStatus = document.getElementById('voiceStatus');
const chatWindow = document.getElementById('chatWindow');
const speechBubble = document.getElementById('speechBubble');

function toggleChat() {
  chatOpen = !chatOpen;
  const launcherBtn = document.querySelector('.launcher-btn');
  if (chatOpen) {
    chatWindow.classList.remove('hidden');
    speechBubble.style.display = 'none';
    launcherBtn.style.display = 'none';
  } else {
    chatWindow.classList.add('hidden');
    speechBubble.style.display = 'block';
    launcherBtn.style.display = 'flex';
  }
}

chatInput.addEventListener('input', () => { sendBtn.disabled = chatInput.value.trim() === ''; });
function autoResize(el) { el.style.height = '20px'; el.style.height = Math.min(el.scrollHeight, 72) + 'px'; }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) sendMessage(); } }
function sendChip(text) { chatInput.value = text; sendBtn.disabled = false; sendMessage(); }

function addMessage(text, isUser) {
  const div = document.createElement('div');
  div.className = 'message ' + (isUser ? 'user' : 'bot') + ' msg-fade-in';
  div.innerHTML = `<div class="message-avatar">${isUser ? 'You' : 'CV'}</div><div class="message-bubble">${text.replace(/\n/g,'<br>')}</div>`;
  chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
}
function showTyping() {
  const div = document.createElement('div');
  div.className = 'message bot msg-fade-in'; div.id = 'typingMsg';
  div.innerHTML = `<div class="message-avatar">CV</div><div class="message-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typingMsg'); if (t) t.remove(); }

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || isTyping) return;
  addMessage(text, true);
  chatInput.value = ''; chatInput.style.height = '20px'; sendBtn.disabled = true;
  conversationHistory.push({ role: 'user', content: text });
  isTyping = true; showTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: SYSTEM_PROMPT, messages: conversationHistory })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || '申し訳ありません。もう一度お試しください。';
    removeTyping(); addMessage(reply, false);
    conversationHistory.push({ role: 'assistant', content: reply });
    if (isListening) speakText(reply);
  } catch(e) {
    removeTyping(); addMessage('接続エラーが発生しました。しばらくしてから再度お試しください。', false);
  }
  isTyping = false;
}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ja-JP';
  const ja = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('ja'));
  if (ja) utt.voice = ja;
  window.speechSynthesis.speak(utt);
}

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    voiceStatus.textContent = 'このブラウザは音声入力に対応していません';
    setTimeout(() => voiceStatus.textContent = '', 3000); return;
  }
  if (isListening) { stopListening(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ja-JP'; recognition.continuous = false; recognition.interimResults = true;
  recognition.onstart = () => { isListening = true; voiceBtn.classList.add('listening'); voiceStatus.textContent = '音声を認識中... 話しかけてください'; };
  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    chatInput.value = final || interim;
    sendBtn.disabled = chatInput.value.trim() === '';
    if (final) { voiceStatus.textContent = '音声を認識しました'; setTimeout(() => sendMessage(), 500); }
  };
  recognition.onerror = (e) => {
    voiceStatus.textContent = e.error === 'no-speech' ? 'マイクへの入力を確認してください' : '音声認識エラーが発生しました';
    stopListening(); setTimeout(() => voiceStatus.textContent = '', 3000);
  };
  recognition.onend = () => { stopListening(); };
  recognition.start();
}
function stopListening() {
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  isListening = false; voiceBtn.classList.remove('listening'); voiceStatus.textContent = '';
}
window.speechSynthesis && window.speechSynthesis.getVoices();
</script>
</body>
</html>
